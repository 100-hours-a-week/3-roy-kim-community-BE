spring:
  datasource:
    url: jdbc:mysql://localhost:3306/communityservice?serverTimezone=UTC&useSSL=false
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always     # create SPRING_SESSION tables if missing
    timeout: 300s                                 # 5 분
  jpa:
    hibernate:
      ddl-auto: create   # 개발 중에는 create / create-drop / update 중 선택
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  profiles:
    active: dev
server:
  servlet:
    session:
      cookie:
        name: SID
        http-only: true
        secure: false               # set true in HTTPS
        same-site: Lax
      tracking-modes: cookie

logging:
  level:
    org.hibernate.SQL: debug